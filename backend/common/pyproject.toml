[project]
name = "resume-formatter-common"
version = "0.1.0"
description = "Shared domain, schemas, database models, repositories, queue, and storage adapters for Resume Formatter backends."
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.13.1,<3.0.0",
    "sqlalchemy>=2.0.48,<3.0.0",
    "psycopg2-binary>=2.9.10",
    "boto3>=1.43.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = ".."}
include-package-data = true
py-modules = [
    "app.adapters.aws_client",
]

[tool.setuptools.packages.find]
where = [".."]
namespaces = true
include = [
    "app.adapters.repositories*",
    "app.adapters.queue*",
    "app.adapters.storage*",
    "app.db*",
    "app.domain*",
    "app.schemas*",
    "app.utils*",
]
