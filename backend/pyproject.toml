[project]
name = "agentic-document-platform"
version = "0.1.0"
description = "A Template-aware, privacy-governed, agentic document processing platform"
authors = [
    {name = "Jules",email = "jules@example.com"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.135.2,<0.136.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "langgraph (>=1.1.4,<2.0.0)",
    "langchain-core (>=1.2.23,<2.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "qdrant-client (>=1.17.1,<2.0.0)",
    "chromadb (>=1.5.5,<2.0.0)",
    "google-generativeai (>=0.8.6,<0.9.0)",
    "docxtpl (>=0.20.2,<0.21.0)",
    "sentence-transformers (>=3.0.0,<4.0.0)",
    "torch (>=2.0.0,<3.0.0)",
    "fastapi-mcp (>=0.1.0)",
    "mcp (>=1.27.0,<2.0.0)",
    "sse-starlette (>=3.3.4,<4.0.0)",
    "mangum (>=0.21.0,<0.22.0)",
    "boto3 (>=1.43.0,<2.0.0)",
    "moto (>=5.1.22,<6.0.0)",
    "psycopg2-binary (>=2.9.10)",
    "docling (>=2.0.0,<3.0.0)"
]


# ADD THIS SECTION HERE
[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.optional-dependencies]
# 2. Cloud Providers (Native Integrations)
cloud-aws-native = [
    "boto3 (>=1.36.0,<2.0.0)"
]

# 3. Local Runtime Variants
runtime-local-aws = [
    "boto3 (>=1.36.0,<2.0.0)",
    "localstack-client (>=2.0.0)"
]

# 4. Agnostic Layer
agnostic = [
    "httpx (>=0.27.0,<1.0.0)"
]

# 5. Parser / Extraction Engines
parser-unstructured = [
    "unstructured (>=0.14.0,<1.0.0)"
]

# 6. Dev / Testing Layer
dev-local = [
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-asyncio (>=0.23.0,<1.0.0)"
]

[dependency-groups]
dev = [
    "httpx (>=0.28.1,<0.29.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-asyncio (>=0.23.0,<0.24.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
