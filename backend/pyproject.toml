[project]
name = "agentic-document-platform"
version = "0.1.0"
description = "A Template-aware, privacy-governed, agentic document processing platform"
authors = [
    {name = "Jules",email = "jules@example.com"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.135.2,<0.136.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "langgraph (>=1.1.4,<2.0.0)",
    "langchain-core (>=1.2.23,<2.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "qdrant-client (>=1.17.1,<2.0.0)",
    "chromadb (>=1.5.5,<2.0.0)",
    "google-generativeai (>=0.8.6,<0.9.0)",
    "docxtpl (>=0.20.2,<0.21.0)",
    "fastapi-mcp (>=0.1.0)",
    "mcp (>=1.27.0,<2.0.0)",
    "sse-starlette (>=3.3.4,<4.0.0)",
    "Mangum (>=0.21.0,<0.22.0)",
    "boto3 (>=1.43.0,<2.0.0)",
    "moto (>=5.1.22,<6.0.0)",
    "psycopg2-binary (>=2.9.10)",
    "lxml (>=5.3.0)",
    "jinja2 (>=3.1.6)"
]


# ADD THIS SECTION HERE
[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.optional-dependencies]
aws = [
    "boto3 (>=1.36.0,<2.0.0)"
]
gcp = [
    "google-cloud-storage (>=2.18.0,<3.0.0)",
    "google-cloud-pubsub (>=2.27.0,<3.0.0)",
    "google-cloud-aiplatform (>=1.75.0,<2.0.0)"
]
azure = [
    "azure-storage-blob (>=12.24.0,<13.0.0)",
    "azure-servicebus (>=7.14.0,<8.0.0)",
    "openai (>=1.59.0,<2.0.0)"
]
docling = [
    "docling (>=2.0.0,<3.0.0)",
    "torch (>=2.0.0,<3.0.0)"
]
ocr = [
    "pytesseract (>=0.3.13,<0.4.0)",
    "rapidocr-onnxruntime (>=1.4.4,<2.0.0)"
]
local = [
    "localstack-client (>=2.0.0)"
]
agnostic = [
    "httpx (>=0.27.0,<1.0.0)"
]
dev-local = [
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-asyncio (>=0.23.0,<1.0.0)"
]

[dependency-groups]
dev = [
    "httpx (>=0.28.1,<0.29.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-asyncio (>=0.23.0,<0.24.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
