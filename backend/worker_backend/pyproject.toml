[project]
name = "resume-formatter-worker"
version = "0.1.0"
description = "Background worker service for document extraction, template analysis, and resume formatting."
requires-python = ">=3.11,<4.0"
dependencies = [
    "resume-formatter-common==0.1.0",
    "langgraph>=1.1.4,<2.0.0",
    "langchain-core>=1.2.23,<2.0.0",
    "qdrant-client>=1.17.1,<2.0.0",
    "chromadb>=1.5.5,<2.0.0",
    "google-generativeai>=0.8.6,<0.9.0",
    "docxtpl>=0.20.2,<0.21.0",
    "sentence-transformers>=3.0.0,<4.0.0",
    "torch>=2.0.0,<3.0.0",
    "docling>=2.0.0,<3.0.0",
    "lxml>=5.3.0",
    "jinja2>=3.1.6",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = ".."}
include-package-data = true
py-modules = [
    "app.config",
    "app.dependencies",
]

[tool.setuptools.packages.find]
where = [".."]
namespaces = true
include = [
    "worker_backend*",
    "app.adapters*",
    "app.agent*",
    "app.config*",
    "app.core*",
    "app.dependencies*",
    "app.services*",
    "app.template_analysis*",
]
