AWSTemplateFormatVersion: '2010-09-09'
Description: Agentic Document Platform using ECS Worker and Stateless FastAPI API

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for ECS Cluster
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for ECS Tasks

Resources:
  # ---------------------------------------------------------
  # S3 Buckets
  # ---------------------------------------------------------
  InputStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "agentic-doc-input-${Environment}-${AWS::AccountId}"

  OutputStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "agentic-doc-output-${Environment}-${AWS::AccountId}"

  # ---------------------------------------------------------
  # SQS Queue
  # ---------------------------------------------------------
  ProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "document-processing-queue-${Environment}"
      VisibilityTimeout: 900
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProcessingDLQ.Arn
        maxReceiveCount: 3

  ProcessingDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "document-processing-dlq-${Environment}"

  # ---------------------------------------------------------
  # ECR Repositories
  # ---------------------------------------------------------
  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "agentic-doc-api-${Environment}"

  WorkerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "agentic-doc-worker-${Environment}"

  # ---------------------------------------------------------
  # ECS Cluster
  # ---------------------------------------------------------
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "agentic-doc-cluster-${Environment}"

  # ---------------------------------------------------------
  # IAM Roles
  # ---------------------------------------------------------
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiS3SqsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub "${InputStorageBucket.Arn}/*"
                  - !Sub "${OutputStorageBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt ProcessingQueue.Arn

  WorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WorkerS3SqsBedrockPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub "${InputStorageBucket.Arn}/*"
                  - !Sub "${OutputStorageBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt ProcessingQueue.Arn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeAgent
                  - bedrock:Retrieve
                  - bedrock:RetrieveAndGenerate
                Resource: "*"

  # ---------------------------------------------------------
  # ECS Task Definitions
  # ---------------------------------------------------------
  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "agentic-doc-api-${Environment}"
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/agentic-doc-api-${Environment}:latest"
          PortMappings:
            - ContainerPort: 8000
          Environment:
            - Name: CLOUD_PROVIDER
              Value: aws
            - Name: RUNTIME_MODE
              Value: aws
            - Name: PROCESSING_MODE
              Value: async
            - Name: QUEUE_PROVIDER
              Value: sqs
            - Name: STORAGE_PROVIDER
              Value: s3
            - Name: S3_BUCKET_INPUT
              Value: !Ref InputStorageBucket
            - Name: S3_BUCKET_OUTPUT
              Value: !Ref OutputStorageBucket
            - Name: SQS_PROCESSING_QUEUE_URL
              Value: !Ref ProcessingQueue

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "agentic-doc-worker-${Environment}"
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '2048'
      Memory: '4096'
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerTaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/agentic-doc-worker-${Environment}:latest"
          Environment:
            - Name: CLOUD_PROVIDER
              Value: aws
            - Name: RUNTIME_MODE
              Value: aws
            - Name: PROCESSING_MODE
              Value: async
            - Name: QUEUE_PROVIDER
              Value: sqs
            - Name: STORAGE_PROVIDER
              Value: s3
            - Name: AGENT_PROVIDER
              Value: bedrock_agent
            - Name: KNOWLEDGE_PROVIDER
              Value: bedrock_kb
            - Name: S3_BUCKET_INPUT
              Value: !Ref InputStorageBucket
            - Name: S3_BUCKET_OUTPUT
              Value: !Ref OutputStorageBucket
            - Name: SQS_PROCESSING_QUEUE_URL
              Value: !Ref ProcessingQueue


  # ---------------------------------------------------------
  # ECS Services and Load Balancer
  # ---------------------------------------------------------
  ApiLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "api-alb-${Environment}"
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Scheme: internet-facing
      Type: application

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "api-tg-${Environment}"
      Port: 8000
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30

  ApiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApiLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  ApiService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref EcsCluster
      ServiceName: !Sub "api-service-${Environment}"
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref EcsSecurityGroup
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8000
          TargetGroupArn: !Ref ApiTargetGroup
      DependsOn: ApiListener

  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref EcsCluster
      ServiceName: !Sub "worker-service-${Environment}"
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref EcsSecurityGroup
          AssignPublicIp: ENABLED

Outputs:
  ApiEndpoint:
    Value: !GetAtt ApiLoadBalancer.DNSName

  ApiRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
  WorkerRepositoryUri:
    Value: !GetAtt WorkerRepository.RepositoryUri
  ProcessingQueueUrl:
    Value: !Ref ProcessingQueue
