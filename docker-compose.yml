services:
  api:
    image: 114644266543.dkr.ecr.ap-south-1.amazonaws.com/agentic-doc-api-dev:v1.0.1
    ports:
      - "8000:8000"
    environment:
      - CLOUD_PROVIDER=aws
      - RUNTIME_MODE=aws
      - PROCESSING_MODE=async
      - QUEUE_PROVIDER=sqs
      - STORAGE_PROVIDER=s3
      - AGENT_PROVIDER=python_orchestrated
      - KNOWLEDGE_PROVIDER=bedrock_kb
      - LLM_BACKEND=aws_bedrock
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_PROFILE=default
      - S3_BUCKET_INPUT=${S3_BUCKET_INPUT}
      - S3_BUCKET_OUTPUT=${S3_BUCKET_OUTPUT}
      - SQS_PROCESSING_QUEUE_URL=${SQS_PROCESSING_QUEUE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - BEDROCK_AGENT_ID=${BEDROCK_AGENT_ID}
      - BEDROCK_AGENT_ALIAS_ID=${BEDROCK_AGENT_ALIAS_ID}
      - BEDROCK_KB_ID=${BEDROCK_KB_ID}
    volumes:
      - ~/.aws:/root/.aws

  worker:
    image: 114644266543.dkr.ecr.ap-south-1.amazonaws.com/agentic-doc-worker-dev:v1.0.1
    environment:
      - CLOUD_PROVIDER=aws
      - RUNTIME_MODE=aws
      - PROCESSING_MODE=async
      - QUEUE_PROVIDER=sqs
      - STORAGE_PROVIDER=s3
      - AGENT_PROVIDER=python_orchestrated
      - KNOWLEDGE_PROVIDER=bedrock_kb
      - LLM_BACKEND=aws_bedrock
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_PROFILE=default
      - S3_BUCKET_INPUT=${S3_BUCKET_INPUT}
      - S3_BUCKET_OUTPUT=${S3_BUCKET_OUTPUT}
      - SQS_PROCESSING_QUEUE_URL=${SQS_PROCESSING_QUEUE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - BEDROCK_AGENT_ID=${BEDROCK_AGENT_ID}
      - BEDROCK_AGENT_ALIAS_ID=${BEDROCK_AGENT_ALIAS_ID}
      - BEDROCK_KB_ID=${BEDROCK_KB_ID}
    volumes:
      - ~/.aws:/root/.aws

  frontend:
    build: ./frontend
    image: 114644266543.dkr.ecr.ap-south-1.amazonaws.com/agentic-doc-frontend-dev:v1.0.1
    ports:
      - "4200:80"
    depends_on:
      - api
