version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      args:
        - EXTRA_DEPENDENCIES=parser-tika
    ports:
      - "8000:8000"
    environment:
      # AWS Settings using credentials injected from local .env
      - CLOUD_PROVIDER=aws
      - RUNTIME_MODE=aws
      - PROCESSING_MODE=async
      - QUEUE_PROVIDER=sqs
      - STORAGE_PROVIDER=s3
      - AGENT_PROVIDER=bedrock_agent
      - KNOWLEDGE_PROVIDER=bedrock_kb
      - LLM_BACKEND=aws_bedrock

      # Passed from root .env file
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_INPUT=${S3_BUCKET_INPUT}
      - S3_BUCKET_OUTPUT=${S3_BUCKET_OUTPUT}
      - SQS_PROCESSING_QUEUE_URL=${SQS_PROCESSING_QUEUE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - BEDROCK_AGENT_ID=${BEDROCK_AGENT_ID}
      - BEDROCK_AGENT_ALIAS_ID=${BEDROCK_AGENT_ALIAS_ID}
      - BEDROCK_KB_ID=${BEDROCK_KB_ID}
    volumes:
      - ./backend/app:/app/app
      - ./backend/config:/app/config

  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      args:
        - EXTRA_DEPENDENCIES=parser-tika
    command: ["python", "app/core/worker.py"]
    environment:
      # Identical environment to API for AWS resource access
      - CLOUD_PROVIDER=aws
      - RUNTIME_MODE=aws
      - PROCESSING_MODE=async
      - QUEUE_PROVIDER=sqs
      - STORAGE_PROVIDER=s3
      - AGENT_PROVIDER=bedrock_agent
      - KNOWLEDGE_PROVIDER=bedrock_kb
      - LLM_BACKEND=aws_bedrock

      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_INPUT=${S3_BUCKET_INPUT}
      - S3_BUCKET_OUTPUT=${S3_BUCKET_OUTPUT}
      - SQS_PROCESSING_QUEUE_URL=${SQS_PROCESSING_QUEUE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - BEDROCK_AGENT_ID=${BEDROCK_AGENT_ID}
      - BEDROCK_AGENT_ALIAS_ID=${BEDROCK_AGENT_ALIAS_ID}
      - BEDROCK_KB_ID=${BEDROCK_KB_ID}
    volumes:
      - ./backend/app:/app/app
      - ./backend/config:/app/config

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api
